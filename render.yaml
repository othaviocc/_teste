databases:
  - name: socketext-db
    databaseName: socketext
    user: socketext
    plan: free

services:
  - type: web
    name: socketext-primary
    runtime: python
    plan: free
    rootDir: server_primary
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: socketext-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

  - type: web
    name: socketext-secondary
    runtime: python
    plan: free
    rootDir: server_secondary
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: socketext-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: PRIMARY_URL
        value: https://socketext-primary.onrender.com

  - type: web
    name: socketext-client
    runtime: static
    rootDir: client
    buildCommand: echo "static"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
